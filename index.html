.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
.hidden{display:none}

/* ---------- type ---------- */
.tag{font-family:var(--tag);font-weight:400;line-height:.95;margin:0;color:var(--chalk);
  text-shadow:0 0 1px #000,3px 3px 0 rgba(0,0,0,.55);letter-spacing:.01em;word-break:break-word}
h1.tag{font-size:clamp(34px,9.5vw,54px);margin-top:6px}
h2.tag{font-size:clamp(34px,10vw,50px);color:var(--hivis)}
.stencil{font-family:var(--stencil);font-weight:900;text-transform:uppercase;font-size:30px;line-height:1;letter-spacing:.02em;margin:34px 0 12px;
  display:inline-block;position:relative;padding:4px 12px 2px 8px;color:var(--asphalt);
  background:radial-gradient(ellipse at 20% 40%,var(--spray) 0 58%,transparent 72%),radial-gradient(ellipse at 75% 60%,var(--spray) 0 55%,transparent 71%);
  filter:drop-shadow(0 0 1px rgba(255,95,31,.4));transform:rotate(-1.2deg)}
.stencil::after{content:"";position:absolute;left:14%;bottom:-9px;width:3px;height:10px;background:var(--spray);border-radius:0 0 3px 3px;box-shadow:38px -2px 0 -0.5px var(--spray),86px 1px 0 0 var(--spray)}
.callout{text-shadow:2px 2px 0 #000;font-family:var(--marker);font-size:19px;line-height:1.35;color:var(--hivis);margin:14px 0 0;max-width:60ch;transform:rotate(-.4deg)}
.note{text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6);color:var(--dust);font-size:14.5px;margin:10px 0 0;max-width:62ch}
.num{text-align:right;font-family:var(--stencil);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.big-n{font-weight:900;font-size:23px}
.cash{color:var(--cash)}
.danger{color:var(--blood)}
.status{min-height:1.5em;color:var(--dust);margin-top:14px;font-family:var(--marker);font-size:17px}
.status.err{color:var(--blood)}

/* ---------- setup / hero ---------- */
.hero{padding:9vh 0 0;position:relative}
.brand{font-family:var(--tag);font-size:clamp(78px,24vw,150px);line-height:.8;margin:0;color:var(--spray);position:relative;display:inline-block;
  text-shadow:4px 4px 0 #000;transform:rotate(-4deg);transform-origin:left bottom}
.brand .b2{display:block;color:var(--chalk);margin-left:.18em}
.brand svg{position:absolute;left:4%;top:34%;width:92%;height:auto;overflow:visible}
.hero .kicker{font-family:var(--marker);font-size:22px;color:var(--hivis);margin:40px 0 6px;transform:rotate(-1deg)}
.hero p.lead{max-width:44ch;color:var(--chalk);margin:0 0 22px;font-size:17px}
.connect{display:flex;gap:10px;flex-wrap:wrap}
.connect input{flex:1 1 220px;padding:14px;border:3px solid var(--chalk);background:var(--slab);border-radius:2px;font-size:17px;font-weight:600}
.sticker{font-family:var(--stencil);font-weight:900;text-transform:uppercase;font-size:21px;letter-spacing:.03em;padding:12px 22px;border:3px solid #000;border-radius:3px;
  background:var(--hivis);color:#000;box-shadow:4px 4px 0 #000;transform:skewX(-8deg);cursor:pointer}
.sticker:active{transform:skewX(-8deg) translate(2px,2px);box-shadow:2px 2px 0 #000}
.sticker:disabled{opacity:.6}
.sticker.small{font-size:15px;padding:6px 12px;box-shadow:3px 3px 0 #000;border-width:2px}
.linkish{background:none;border:0;color:var(--dust);text-decoration:underline;text-underline-offset:3px;font-size:14px;cursor:pointer;padding:6px}

/* ---------- masthead + tabs ---------- */
.masthead{padding-bottom:4px}
.mh-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-sm{font-family:var(--tag);font-size:22px;color:var(--spray);transform:rotate(-3deg);display:inline-block;text-shadow:2px 2px 0 #000}

<body>
<div class="wrap">
  <section id="setup" class="hero">
    <h1 class="brand" aria-label="Chop Block">Chop<span class="b2">Block</span>
      <svg viewBox="0 0 300 40" aria-hidden="true"><path d="M2 30 C60 22 150 12 298 4" stroke="#E3262F" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M92 20 v16 M180 13 v22 M236 9 v12" stroke="#E3262F" stroke-width="4" stroke-linecap="round"/></svg>
    </h1>
    <p class="kicker">Don't be the lowest. That's the whole game.</p>
    <p class="lead">Guillotine waiver war room for Sleeper. Live scores, every rival's bankroll, and bids built to make everybody else overpay.</p>
    <div class="connect">
      <input id="lid" inputmode="numeric" autocomplete="off" placeholder="League ID or sleeper.com link" aria-label="Sleeper league ID">
      <button class="sticker" id="go">Pull up</button>
    </div>
    <p class="note">The ID is the long number at the end of your league's web address. Read-only. We just look.</p>
    <div id="status" class="status" role="status"></div>
  </section>
  <div id="app" hidden></div>
</div>
<script>
// ---------- Core: data loading + FAAB model (no DOM) ----------
const API = 'https://api.sleeper.app';
let fetchJSON = async (url) => {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
  return r.json();
};

const SLOT_ELIG = {
  QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'], DEF: ['DEF'],
  DL: ['DL'], LB: ['LB'], DB: ['DB'],
  FLEX: ['RB', 'WR', 'TE'], WRRB_FLEX: ['WR', 'RB'], REC_FLEX: ['WR', 'TE'],
  SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'], IDP_FLEX: ['DL', 'LB', 'DB']
};

function teamName(roster, usersById) {
  const u = usersById[roster.owner_id];
  if (!u) return 'Team ' + roster.roster_id;
  return (u.metadata && u.metadata.team_name) || u.display_name || ('Team ' + roster.roster_id);
}

function makeScorer(sc) {
  const rec = sc.rec || 0;
  const base = rec >= 1 ? 'pts_ppr' : rec >= 0.5 ? 'pts_half_ppr' : 'pts_std';
  return (stats) => {
    if (!stats) return null;
    let t = 0, hit = false;
    for (const k in stats) {
      if (sc[k] != null && typeof stats[k] === 'number') { t += sc[k] * stats[k]; hit = true; }
    }
    if ((!hit || t === 0) && typeof stats[base] === 'number') return stats[base];
    return hit ? t : null;
  };
}

function quantile(arr, q) {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b);
  const pos = (s.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return s[lo] + (s[hi] - s[lo]) * (pos - lo);
}

async function loadLeague(leagueId, onStep = () => {}) {
  onStep('Reading league');
  const [nfl, league] = await Promise.all([
    fetchJSON(API + '/v1/state/nfl'),
    fetchJSON(API + '/v1/league/' + encodeURIComponent(leagueId))
  ]);
  if (!league || !league.league_id) throw new Error('No Sleeper league found with ID ' + leagueId + '.');
  const season = league.season;
  const live = String(nfl.season) === String(season) && nfl.season_type === 'regular';
  const week = live ? Math.max(1, nfl.display_week || nfl.week || 1) : 18;

  onStep('Reading rosters');
  const [users, rosters] = await Promise.all([
    fetchJSON(API + '/v1/league/' + leagueId + '/users'),
    fetchJSON(API + '/v1/league/' + leagueId + '/rosters')
  ]);
  const usersById = Object.fromEntries((users || []).map(u => [u.user_id, u]));

  onStep('Reading weekly results and waivers');
  const weeks = Array.from({ length: week }, (_, i) => i + 1);
  const [matchups, txns] = await Promise.all([
    Promise.all(weeks.map(w => fetchJSON(API + '/v1/league/' + leagueId + '/matchups/' + w).catch(() => []))),
    Promise.all(weeks.map(w => fetchJSON(API + '/v1/league/' + leagueId + '/transactions/' + w).catch(() => [])))
  ]);

  // positions used by this league
  const posSet = new Set();
  (league.roster_positions || []).forEach(s => (SLOT_ELIG[s] || []).forEach(p => posSet.add(p)));
  if (!posSet.size) ['QB', 'RB', 'WR', 'TE'].forEach(p => posSet.add(p));
  const posQS = [...posSet].map(p => 'position[]=' + p).join('&');

  onStep('Reading projections, stats and live games');
  const [schedule, projWeek, projSeason, statsSeason] = await Promise.all([
    live ? fetchJSON(`${API}/schedule/nfl/regular/${season}`).catch(() => []) : [],
    live ? fetchJSON(`${API}/projections/nfl/${season}/${week}?season_type=regular&${posQS}`).catch(() => []) : [],
    fetchJSON(`${API}/projections/nfl/${season}?season_type=regular&${posQS}`).catch(() => []),
    fetchJSON(`${API}/stats/nfl/${season}?season_type=regular&${posQS}`).catch(() => [])
  ]);

  return buildModel({ schedule, nfl, league, users, usersById, rosters, matchups, txns, projWeek, projSeason, statsSeason, week, live, posSet });
}

function buildModel(d) {
  const { league, usersById, rosters, matchups, txns, week, live } = d;
  const score = makeScorer(league.scoring_settings || {});
  const budget = (league.settings && league.settings.waiver_budget) || 100;

  // ---------- players ----------
  const players = {};
  const touch = (row) => {
    const id = row.player_id; if (!id) return null;
    if (!players[id]) {
      const p = row.player || {};
      const pos = p.position || (p.fantasy_positions || [])[0] || '?';
      players[id] = {
        id, pos,
        name: pos === 'DEF' ? ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || id
                            : ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || id,
        team: row.team || p.team || '',
        inj: p.injury_status || '',
        wk: null, ros: null, std: null, gp: 0, leaguePts: []
      };
    }
    return players[id];
  };
  (d.projWeek || []).forEach(r => { const p = touch(r); if (p) p.wk = score(r.stats); });
  (d.projSeason || []).forEach(r => {
    const p = touch(r); if (!p) return;
    const pts = score(r.stats); const gp = (r.stats && r.stats.gp) || 0;
    if (pts != null) p.ros = pts / (gp >= 4 ? Math.min(gp, 17) : 17);
  });
  (d.statsSeason || []).forEach(r => {
    const p = touch(r); if (!p) return;
    const gp = (r.stats && (r.stats.gp || r.stats.gms_active)) || 0;
    const pts = score(r.stats);
    if (gp > 0 && pts != null) { p.std = pts / gp; p.gp = gp; }
  });
  const ensure = (id) => players[id] || (players[id] = { id, pos: '?', name: 'Player ' + id, team: '', inj: '', wk: null, ros: null, std: null, gp: 0, leaguePts: [] });

  // league-scored points from matchups (fallback value)
  matchups.forEach((wk) => (wk || []).forEach(m => {
    Object.entries(m.players_points || {}).forEach(([pid, pts]) => { if (pts) ensure(pid).leaguePts.push(pts); });
  }));
  Object.values(players).forEach(p => {
    const lp = p.leaguePts.length ? p.leaguePts.reduce((a, b) => a + b, 0) / p.leaguePts.length : null;
    if (p.ros != null && p.std != null) { const w = Math.min(0.4, p.gp * 0.1); p.val = p.ros * (1 - w) + p.std * w; }
    else if (p.ros != null) p.val = p.ros;
    else if (p.std != null) p.val = p.std * Math.min(1, p.gp / 4);
    else p.val = lp ?? p.wk ?? 0;
  });

  // ---------- teams ----------
  const anyRostered = rosters.some(r => (r.players || []).length);
  const teams = rosters.map(r => {
    const used = (r.settings && r.settings.waiver_budget_used) || 0;
    const reserve = new Set([...(r.reserve || []), ...(r.taxi || [])]);
    const ids = (r.players || []);
    ids.forEach(ensure);
    const t = {
      rid: r.roster_id, owner: r.owner_id, name: teamName(r, usersById), ownerName: (usersById[r.owner_id] || {}).display_name || '',
      players: ids, active: ids.filter(id => !reserve.has(id)),
      used, rem: Math.max(0, budget - used),
      alive: anyRostered ? ids.length > 0 : true,
      weekly: [], chopWeek: null, finalPlayers: []
    };
    matchups.forEach((wk, i) => {
      const m = (wk || []).find(x => x.roster_id === r.roster_id);
      if (m) {
        t.weekly[i + 1] = m.points || 0;
        if ((m.players || []).length) { t.lastWeekWithPlayers = i + 1; t.finalPlayers = m.players; }
      }
    });
    if (!t.alive) t.chopWeek = t.lastWeekWithPlayers || null;
    return t;
  });
  const byRid = Object.fromEntries(teams.map(t => [t.rid, t]));
  const alive = teams.filter(t => t.alive);
  const chopped = teams.filter(t => !t.alive).sort((a, b) => (a.chopWeek || 0) - (b.chopWeek || 0));

  const rosteredAlive = new Set(alive.flatMap(t => t.players));
  const choppedFrom = {};
  chopped.forEach(t => t.finalPlayers.forEach(pid => { ensure(pid); choppedFrom[pid] = { team: t.name, week: t.chopWeek }; }));

  // ---------- lineups ----------
  const slots = (league.roster_positions || []).filter(s => SLOT_ELIG[s])
    .sort((a, b) => SLOT_ELIG[a].length - SLOT_ELIG[b].length);
  const lineup = (ids, key) => {
    const pool = ids.map(id => players[id]).filter(Boolean)
      .sort((a, b) => (b[key] ?? 0) - (a[key] ?? 0));
    const usedIds = new Set();
    return slots.map(slot => {
      const p = pool.find(x => !usedIds.has(x.id) && SLOT_ELIG[slot].includes(x.pos));
      if (p) usedIds.add(p.id);
      return { slot, pid: p ? p.id : null, v: p ? (p[key] ?? 0) : 0 };
    });
  };
  alive.forEach(t => {
    t.lineupVal = lineup(t.active, 'val');
    t.projWeek = live ? lineup(t.active, 'wk').reduce((a, s) => a + s.v, 0) : null;
  });
  // live scoring for the current week: actual points + projection for starters still to play
  const gameStatus = {};
  (d.schedule || []).filter(g => g.week === week).forEach(g => { gameStatus[g.home] = g.status; gameStatus[g.away] = g.status; });
  const cur = matchups[week - 1] || [];
  const started = cur.some(x => (x.points || 0) !== 0);
  model_live: {
    if (!live) break model_live;
    alive.forEach(t => {
      const x = cur.find(y => y.roster_id === t.rid);
      if (!started || !x) { t.now = 0; t.left = t.projWeek; t.playing = []; t.final = t.projWeek; return; }
      let left = 0; const playing = [];
      (x.starters || []).forEach((pid, i) => {
        const p = players[pid]; if (!p) return;
        const st = gameStatus[p.team] || (Object.keys(gameStatus).length ? 'complete' : 'pre_game');
        const scored = (x.starters_points || [])[i] || 0;
        if (st === 'complete') return;
        const rem = st === 'pre_game' ? (p.wk || 0) : Math.max(0, (p.wk || 0) - scored);
        left += rem; playing.push({ pid, st, scored, rem });
      });
      t.now = x.points || 0; t.left = left; t.playing = playing; t.final = t.now + left;
    });
    const sorted = [...alive].sort((a, b) => a.final - b.final);
    sorted.forEach((t, i) => t.projRank = i + 1);
    // clinched chop: no starters left and below everyone else's current score
    if (started) alive.forEach(t => {
      t.clinchedChop = t.playing.length === 0 && alive.every(o => o === t || o.now > t.now);
      t.clinchedSafe = alive.some(o => o !== t && o.playing.length === 0 && o.now < t.now);
    });
  }

  // ---------- waiver market ----------
  const all = txns.flatMap((list, i) => (list || []).map(x => ({ ...x, _week: i + 1 })))
    .filter(x => x.type === 'waiver');
  const spent = {};
  const market = [];
  const done = all.filter(x => x.status === 'complete').sort((a, b) => (a._week - b._week) || (a.created - b.created));
  const failed = all.filter(x => x.status === 'failed');
  done.forEach(x => {
    const bid = (x.settings && x.settings.waiver_bid) || 0;
    Object.entries(x.adds || {}).forEach(([pid, rid]) => {
      const before = budget - (spent[rid] || 0);
      ensure(pid);
      market.push({
        week: x.leg || x._week, pid, rid, bid, before,
        pct: before > 0 ? bid / before : 0,
        pctTotal: bid / budget,
        losers: failed.filter(f => f.adds && f.adds[pid] != null && (f.leg || f._week) === (x.leg || x._week))
          .map(f => ({ rid: f.roster_ids && f.roster_ids[0], bid: (f.settings && f.settings.waiver_bid) || 0 }))
          .filter(l => l.rid !== rid)
          .reduce((acc, l) => { const e = acc.find(a => a.rid === l.rid); if (!e) acc.push(l); else e.bid = Math.max(e.bid, l.bid); return acc; }, [])
          .sort((a, b) => b.bid - a.bid)
      });
    });
    const rid = (x.roster_ids || [])[0] ?? Object.values(x.adds || {})[0];
    if (rid != null) spent[rid] = (spent[rid] || 0) + bid;
  });
  market.sort((a, b) => (b.week - a.week) || (b.bid - a.bid));

  // every bid (won or lost) with the bidder's budget at the time, for rival profiling
  const spentBefore = (rid, w) => done.filter(x => (x.leg || x._week) < w && ((x.roster_ids || [])[0] === rid))
    .reduce((a, x) => a + ((x.settings && x.settings.waiver_bid) || 0), 0);
  const bidLog = [];
  const seen = new Set();
  [...done, ...failed].forEach(x => {
    const rid = (x.roster_ids || [])[0]; const w = x.leg || x._week; const bid = (x.settings && x.settings.waiver_bid) || 0;
    Object.keys(x.adds || {}).forEach(pid => {
      const key = rid + ':' + pid + ':' + w; if (seen.has(key)) return; seen.add(key);
      const before = budget - spentBefore(rid, w);
      bidLog.push({ rid, pid, week: w, bid, before, pct: before > 0 ? bid / before : 0, won: x.status === 'complete' });
    });
  });

  // ---------- available pool ----------
  const posSet = d.posSet;
  const pool = Object.values(players)
    .filter(p => !rosteredAlive.has(p.id) && posSet.has(p.pos))
    .map(p => ({ ...p, chopped: choppedFrom[p.id] || null }))
    .filter(p => p.chopped || (p.val > 0.5))
    .sort((a, b) => b.val - a.val);

  const remainingChops = Math.max(1, Math.min(alive.length - 1, 18 - week + 1));

  return { league, budget, week, live, started, players, teams, byRid, alive, chopped, pool, market, bidLog, slots, schedule: d.schedule || [], lineupFn: lineup, remainingChops };
}

// ---------- bid model ----------
const DEFAULT_PCT = [0.35, 0.18, 0.07, 0.02];

function upgradeFor(team, p) {
  if (!team || !team.lineupVal) return 0;
  const elig = team.lineupVal.filter(s => SLOT_ELIG[s.slot].includes(p.pos));
  if (!elig.length) return 0;
  const weakest = Math.min(...elig.map(s => s.pid ? s.v : 0));
  return (p.val || 0) - weakest;
}

function bidPlan(model, p, myRid, excludeRid) {
  const me = model.byRid[myRid];
  const myRem = me ? (me.alive ? me.rem : 0) : 0;
  const rivals = model.alive.filter(t => t.rid !== myRid && t.rid !== excludeRid).map(t => ({
    t, rem: t.rem, up: upgradeFor(t, p)
  }));
  const interested = rivals.filter(r => r.up > 0.5 && r.rem > 0).sort((a, b) => b.rem - a.rem);
  const myUp = me && me.alive ? upgradeFor(me, p) : 0;

  const rank = model.pool.filter(x => x.id !== p.id && x.val > (p.val || 0)).length + 1;
  const tier = rank <= 2 ? 0 : rank <= 6 ? 1 : rank <= 15 ? 2 : 3;
  // price comps: past winning bids on players of similar value and position
  const comps = model.market.filter(m => m.bid > 0 && model.players[m.pid]).map(m => {
    const q = model.players[m.pid];
    const dist = Math.abs((q.val || 0) - (p.val || 0)) + (q.pos === p.pos ? 0 : 2) + ((q.pos === 'QB') !== (p.pos === 'QB') ? 8 : 0);
    return { m, q, dist };
  }).sort((a, b) => a.dist - b.dist).slice(0, 5);
  let pct = DEFAULT_PCT[tier], basis = 'default';
  if (comps.length >= 2) {
    const w = comps.map(c => 1 / (1 + c.dist));
    pct = comps.reduce((a, c, i) => a + c.m.pct * w[i], 0) / w.reduce((a, b) => a + b, 0);
    const maxVal = Math.max(...comps.map(c => c.q.val || 0));
    if ((p.val || 0) > maxVal) pct = Math.min(0.6, pct + ((p.val || 0) - maxVal) * 0.03);
    basis = 'league';
    if (comps.length < 4) { pct = (pct + DEFAULT_PCT[tier]) / 2; basis = 'blend'; }
  }
  const top = interested[0], second = interested[1];
  const cap = (n) => Math.max(0, Math.min(myRem, Math.round(n)));
  const lock = top ? cap(top.rem + 1) : cap(1);
  const beatMost = second ? cap(second.rem + 1) : lock;
  const priceSetter = top ? top.rem : myRem;
  const value = Math.min(beatMost, Math.max(1, cap(pct * priceSetter)));
  const pace = myRem / model.remainingChops;

  return { me, myRem, myUp, rivals, interested, rank, tier, pct, basis, comps, value, beatMost, lock, pace };
}

// ---------- Game theory layer: survival simulation, rival bid profiles, win odds ----------
const LAST_WEEK = 18;
const OUT_STATUSES = new Set(['IR', 'Out', 'Suspended', 'PUP', 'NA', 'Sus']);

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function normCdf(x) { const t = 1 / (1 + 0.2316419 * Math.abs(x)); const d = 0.3989423 * Math.exp(-x * x / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }

// weeks the sim covers, and which NFL teams play each week
function simWeeks(model) {
  const first = model.started ? model.week + 1 : model.week;
  const weeks = []; for (let w = first; w <= LAST_WEEK; w++) weeks.push(w);
  const plays = {};
  model.schedule.forEach(g => { (plays[g.week] = plays[g.week] || new Set()).add(g.home); plays[g.week].add(g.away); });
  return { first, weeks, plays };
}

// expected weekly score for a set of player ids, respecting byes and near-term injuries
function weeklyMeans(model, ids, ctx) {
  const lineupPts = (list) => {
    const pool = list.map(id => model.players[id]).filter(Boolean).sort((a, b) => (b.val || 0) - (a.val || 0));
    const used = new Set(); let tot = 0;
    model.slots.forEach(slot => {
      const p = pool.find(x => !used.has(x.id) && SLOT_ELIG[slot].includes(x.pos));
      if (p) { used.add(p.id); tot += p.val || 0; }
    });
    return tot;
  };
  return ctx.weeks.map((w, i) => {
    const playing = ctx.plays[w];
    const avail = ids.filter(id => {
      const p = model.players[id]; if (!p) return false;
      if (playing && playing.size && p.team && !playing.has(p.team)) return false; // bye
      if (i < 2 && OUT_STATUSES.has(p.inj)) return false; // hurt now: out for the next two weeks
      return true;
    });
    return lineupPts(avail);
  });
}

// average FAAB a surviving team has spent per waiver run so far
function spendRate(model) {
  const runs = new Set(model.market.map(m => m.week)).size || 1;
  const spent = model.alive.reduce((a, t) => a + t.used, 0);
  return spent / model.alive.length / runs;
}

function survivors(model) {
  // teams still alive after the current week (drop a clinched chop)
  return model.alive.filter(t => !t.clinchedChop);
}

// Monte Carlo: each week, lowest score is chopped. Rosters held fixed.
function simulate(model, myRid, extra = {}, iters = 3000, seed = 7) {
  const ctx = simWeeks(model);
  const teams = survivors(model);
  const means = teams.map(t => weeklyMeans(model, t.active.concat(t.rid === myRid ? (extra.add || []) : []), ctx));
  const myIdx = teams.findIndex(t => t.rid === myRid);
  const cv = 0.22;
  const nW = ctx.weeks.length;
  const aliveAfter = new Array(nW).fill(0);
  let wins = 0;
  const cashRivals = new Array(nW).fill(0), teamsLeft = new Array(nW).fill(0), chopFreq = teams.map(() => new Array(nW).fill(0));
  const upReleased = new Array(nW).fill(0);
  const me = teams[myIdx];
  const ups = teams.map(t => me && t !== me ? t.players.filter(id => model.players[id] && upgradeFor(me, model.players[id]) > 0.5).length : 0);
  const rate = spendRate(model);
  const r = rng(seed);
  for (let it = 0; it < iters; it++) {
    const alive = teams.map(() => true); let nAlive = teams.length; let meAlive = myIdx >= 0;
    const cash = teams.map(t => t.rem);
    let playedTo = 0;
    for (let k = 0; k < nW && nAlive > 1; k++) {
      playedTo = k + 1;
      let lo = Infinity, loIdx = -1;
      for (let i = 0; i < teams.length; i++) {
        if (!alive[i]) continue;
        const mu = means[i][k]; const sc = mu + gauss(r) * cv * Math.max(mu, 40);
        if (sc < lo) { lo = sc; loIdx = i; }
      }
      alive[loIdx] = false; nAlive--; chopFreq[loIdx][k]++; upReleased[k] += ups[loIdx];
      if (loIdx === myIdx) meAlive = false;
      if (meAlive) aliveAfter[k]++;
      let tot = 0, n = 0;
      for (let i = 0; i < teams.length; i++) if (alive[i] && i !== myIdx) { cash[i] = Math.max(0, cash[i] - rate); tot += cash[i]; n++; }
      cashRivals[k] += n ? tot / n : 0; teamsLeft[k] += nAlive;
    }
    if (meAlive) { wins++; for (let k = 0; k < nW; k++) if (k >= playedTo) aliveAfter[k]++; }
  }
  const p = aliveAfter.map(x => x / iters);
  return { ctx, weeks: ctx.weeks, p, win: wins / iters, cashRivals: cashRivals.map(x => x / iters), upReleased: upReleased.map(x => x / iters), rate, teamsLeft: teamsLeft.map(x => x / iters), chopFreq, teams, means, myIdx };
}

// how each rival bids: activity (how often they bid on premium players) and aggression (share of budget)
function rivalProfiles(model) {
  const premium = new Set(model.market.filter(m => m.pctTotal >= 0.1).map(m => m.pid + ':' + m.week));
  const nPrem = premium.size || 1;
  const leagueTop = [];
  const prof = {};
  model.alive.forEach(t => {
    const mine = model.bidLog.filter(b => b.rid === t.rid && b.bid > 0);
    const prem = mine.filter(b => premium.has(b.pid + ':' + b.week));
    const topPct = prem.length ? Math.max(...prem.map(b => b.pct)) : null;
    if (topPct != null) leagueTop.push(topPct);
    prof[t.rid] = { activity: Math.min(1, prem.length / nPrem), topPct, bids: mine.length };
  });
  const avgTop = leagueTop.length ? leagueTop.reduce((a, b) => a + b, 0) / leagueTop.length : 0.3;
  Object.values(prof).forEach(p => { p.aggr = p.topPct != null ? p.topPct / avgTop : 1; if (p.bids === 0) p.activity = 0.5; });
  return { prof, avgTop };
}

// P(win) as a function of my bid. Each interested rival's bid is lognormal; the scale is
// calibrated so the median winning price matches what this league has paid for similar players.
function winCurve(model, plan, profiles) {
  const sd = 0.6;
  const base = plan.interested.map(r => {
    const pr = profiles.prof[r.t.rid] || { activity: 0.5, aggr: 1 };
    const strength = Math.min(1, r.up / 4);
    const pBid = Math.min(0.95, 0.25 + 0.5 * pr.activity + 0.25 * strength);
    return { ...r, pBid, w: r.rem * pr.aggr * (0.6 + 0.4 * strength) };
  });
  const make = (c) => (b) => base.reduce((acc, r) => {
    const mean = Math.max(0.5, Math.min(r.rem, c * r.w));
    const pBelow = b > r.rem ? 1 : normCdf((Math.log(Math.max(b, 0.5)) - Math.log(mean)) / sd);
    return acc * ((1 - r.pBid) + r.pBid * pBelow);
  }, 1);
  const rems = plan.interested.map(r => r.rem).sort((a, b) => a - b);
  const typical = rems.length ? rems[Math.floor(rems.length / 2)] : plan.myRem;
  const target = Math.max(1, plan.pct * typical);       // league-history clearing price
  let lo = 0.001, hi = 3;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (make(mid)(target) > 0.5) lo = mid; else hi = mid; }
  const pWin = base.length ? make((lo + hi) / 2) : () => 1;
  const bidFor = (t) => { for (let b = 0; b <= plan.myRem; b++) if (pWin(b) >= t) return b; return null; };
  return { rivals: base, pWin, bidFor, target };
}

// the full recommendation for one player
function strategy(model, p, myRid, ownerRid, cache) {
  const plan = bidPlan(model, p, myRid, ownerRid);
  const profiles = cache.profiles || (cache.profiles = rivalProfiles(model));
  const base = cache.base || (cache.base = simulate(model, myRid));
  const withP = simulate(model, myRid, { add: [p.id] });
  const k4 = Math.min(3, base.p.length - 1);
  const gain = { next: withP.p[0] - base.p[0], four: withP.p[k4] - base.p[k4], win: withP.win - base.win };
  const wc = winCurve(model, plan, profiles);
  const b50 = wc.bidFor(0.5), b80 = wc.bidFor(0.8), b95 = wc.bidFor(0.95);
  const lifeWeeks = Math.max(1, base.p.reduce((a, x) => a + x, 0));
  const pace = plan.myRem / lifeWeeks;
  const eff = b50 ? gain.win / Math.max(1, b50) : 0; // title odds per dollar at today's price
  return { p, plan, base, withP, gain, wc, b50, b80, b95, pace, lifeWeeks, eff };
}

// worth in dollars = title odds gained / value of a dollar; best first-price bid maximises P(win) x (worth - bid)
function finalize(st, benchmark) {
  st.worth = Math.max(0, st.gain.win) / benchmark;
  let best = 0, bestU = 0;
  for (let b = 1; b <= st.plan.myRem; b++) { const u = st.wc.pWin(b) * (st.worth - b); if (u > bestU) { bestU = u; best = b; } }
  st.rec = best; st.recWin = st.wc.pWin(best); st.surplus = bestU;
  return st;
}

// Buy now or wait? Compare title-odds-per-dollar today with what the same kind of player
// should cost later (prices follow rival cash per team) after losing the weeks you waited.
function analyze(model, myRid, candidates) {
  const cache = {};
  const base = cache.base = simulate(model, myRid);
  const rows = candidates.map(({ p, ownerRid }) => strategy(model, p, myRid, ownerRid, cache))
    .filter(st => st.plan.myUp > 0.5 && st.gain.win > 0.002 && st.b50 != null);
  const nW = base.weeks.length;
  const cash0 = model.alive.filter(t => t.rid !== myRid).reduce((a, t) => a + t.rem, 0) / Math.max(1, model.alive.length - 1);
  const bestNow = rows.reduce((a, st) => Math.max(a, st.eff), 0);
  // multiplier on efficiency if you buy the same player k weeks from now
  const future = base.weeks.map((w, k) => {
    const priceIdx = Math.max(0.05, (k ? base.cashRivals[k - 1] : cash0) / cash0);
    const useLeft = Math.max(0, (nW - k) / nW);
    const alive = k ? base.p[k - 1] : 1;
    return { week: w, priceIdx, useLeft, alive, mult: useLeft * alive / priceIdx };
  }).slice(0, Math.max(1, nW - 2));
  const bestLater = future.slice(1).reduce((a, f) => f.mult > a.mult ? f : a, { mult: 0 });
  // Shadow price of a dollar: line up every opportunity you can expect this season (today's
  // options, then similar ones each week as rosters get chopped, cheaper but with fewer weeks
  // left to use them), buy the best title-odds-per-dollar first, and see where $myRem runs out.
  const myRem = rows.length ? rows[0].plan.myRem : 0;
  const opps = [];
  rows.forEach(st => opps.push({ eff: st.eff, cost: st.b50, w: 1, k: 0 }));
  future.slice(1).forEach((f, j) => {
    const supply = base.upReleased[j] || 0;
    const scale = rows.length ? supply / rows.length : 0;
    rows.forEach(st => opps.push({ eff: st.eff * f.mult, cost: st.b50 * f.priceIdx, w: scale * f.alive, k: j + 1 }));
  });
  opps.sort((a, b) => b.eff - a.eff);
  let spent = 0, lambda = 0;
  for (const o of opps) { spent += o.cost * o.w; lambda = o.eff; if (spent >= myRem) break; }
  if (spent < myRem) lambda *= spent / Math.max(1, myRem); // money left over: dollars are cheap
  const benchmark = Math.max(lambda, 1e-9);
  const nowShare = opps.filter(o => o.eff >= benchmark && o.k === 0).reduce((a, o) => a + o.cost, 0);
  rows.forEach(st => finalize(st, benchmark));
  rows.sort((a, b) => b.surplus - a.surplus);
  const waitWins = bestLater.mult > 1.05;
  return { base, rows, future, bestLater, bestNow, benchmark, waitWins, cash0, rate: base.rate, nowShare };
}

// ---------- UI ----------
const DEFAULT_LEAGUE = '1400564478587719680';
const DEFAULT_USER = 'wingernaut';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = (n) => n == null ? '–' : n.toFixed(1);
const money = (n) => '$' + Math.round(n || 0).toLocaleString();
const pct = (x) => Math.round(x * 100) + '%';
const store = {
  get(k) { try { return localStorage.getItem('chopblock:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('chopblock:' + k, v); } catch {} }
};

const S = { model: null, leagueId: null, myRid: null, tab: 'next', pos: 'ALL', choppedOnly: true, q: '', pick: null, bid: null, loadedAt: null, busy: false };

const STEP_TALK = {
  'Reading league': 'Rolling up to the league',
  'Reading rosters': 'Sizing up every roster',
  'Reading weekly results and waivers': 'Pulling the receipts on every bid',
  'Reading projections, stats and live games': 'Checking the live scoreboard'
};

function setStatus(msg, isErr) {
  const el = $('#status'); if (!el) return;
  el.textContent = msg || ''; el.className = isErr ? 'status err' : 'status';
}

async function connect(id, { quiet } = {}) {
  id = (id || '').trim().replace(/.*leagues\//, '').replace(/[^0-9].*$/, '');
  if (!id) { setStatus('Drop a league ID first. Can\u2019t chop what we can\u2019t see.', true); return; }
  S.busy = true; if ($('#go')) $('#go').disabled = true; paintRefresh();
  try {
    const model = await loadLeague(id, (s) => { if (!quiet) setStatus((STEP_TALK[s] || s) + '…'); });
    const first = !S.model || S.leagueId !== id;
    S.model = model; S.leagueId = id; S.loadedAt = new Date(); store.set('league', id);
    if (first) {
      const saved = +store.get('team:' + id);
      let rid = model.byRid[saved] ? saved : null;
      if (!rid) {
        const t = model.teams.find(t => t.ownerName && t.ownerName.toLowerCase() === DEFAULT_USER);
        if (t) { rid = t.rid; store.set('team:' + id, rid); }
      }
      S.myRid = rid;
      S.choppedOnly = model.pool.some(p => p.chopped);
    }
    S.an = null;
    setStatus('');
    $('#setup').hidden = true; $('#app').hidden = false;
    render();
    scheduleRefresh();
  } catch (e) {
    const offline = /Failed to fetch|NetworkError|Load failed/i.test(e.message);
    setStatus(offline
      ? 'Sleeper ghosted us. If you\u2019re looking at this inside the Claude app, that preview blocks the internet. Open the site\u2019s web address in Safari or Chrome instead.'
      : /No Sleeper league|HTTP 404|HTTP 400/.test(e.message) ? 'That league ID is a fumble. Copy it from the end of your sleeper.com league link.' : e.message, true);
    if (S.model) { $('#setup').hidden = true; $('#app').hidden = false; render(); }
  } finally { S.busy = false; if ($('#go')) $('#go').disabled = false; paintRefresh(); }
}

// auto-refresh while games are live
let refreshTimer = null;
function gamesLive() {
  const m = S.model; if (!m) return false;
  return m.schedule.some(g => g.week === m.week && g.status === 'in_game');
}
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  if (gamesLive()) refreshTimer = setTimeout(() => { if (!document.hidden) connect(S.leagueId, { quiet: true }); else scheduleRefresh(); }, 90000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.model && S.loadedAt && Date.now() - S.loadedAt > 60000) connect(S.leagueId, { quiet: true });
});
function paintRefresh() {
  const b = $('#refresh'); if (!b) return;
  b.disabled = S.busy; b.textContent = S.busy ? 'Loading…' : 'Refresh';
}

function header() {
  const m = S.model;
  const opts = [...m.alive, ...m.chopped].map(t =>
    `<option value="${t.rid}" ${t.rid === S.myRid ? 'selected' : ''}>${esc(t.name)}${t.alive ? '' : ' (chopped)'}</option>`).join('');
  const time = S.loadedAt ? S.loadedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  return `
  <header class="masthead">
    <div class="mh-top">
      <span class="brand-sm">Chop Block</span>

    </div>
    <h1 class="tag">${esc(m.league.name || 'Your league')}</h1>
    <p class="sub">${m.live ? 'Week ' + m.week : 'Season ' + m.league.season + ' (final)'} / ${m.alive.length} still breathing of ${m.teams.length} / ${gamesLive() ? '<b class="live">Live</b> updated ' : 'Updated '}${time}</p>
    <label class="me"><span>Your squad</span>
      <select id="mine"><option value="">Pick your team…</option>${opts}</select>
    </label>
  </header>
  <nav class="tabs" role="tablist">
    ${[['next', 'Game plan'], ['pool', 'Waiver wire'], ['bid', 'Bid lab'], ['budgets', 'Bankrolls'], ['market', 'Receipts']].map(([k, l]) =>
      `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join('')}
  </nav>`;
}

// ---------- waiver wire ----------
function viewPool() {

        <td class="num big-n">${f1(p.val)}</td><td class="num">${f1(p.wk)}</td><td class="num">${f1(p.std)}</td>

// ---------- analysis plumbing ----------
function nextChopTeam() {
  const m = S.model; if (!m.live) return null;
  return m.alive.find(t => t.clinchedChop) || [...m.alive].sort((a, b) => a.final - b.final)[0];
}

function ensureAnalysis() {
  const m = S.model;
  if (!S.myRid || !m.byRid[S.myRid] || !m.byRid[S.myRid].alive) return null;
  if (S.an && S.an.rid === S.myRid) return S.an;
  if (!S.anBusy) {
    S.anBusy = true;
    setTimeout(() => {
      const nc = nextChopTeam();
      const seen = new Set(); const cands = [];
      if (nc && nc.rid !== S.myRid) nc.players.forEach(id => { if (m.players[id]) { seen.add(id); cands.push({ p: m.players[id], ownerRid: nc.rid }); } });
      m.pool.slice(0, 30).forEach(p => { if (!seen.has(p.id)) cands.push({ p }); });
      const an = analyze(m, S.myRid, cands);
      an.rid = S.myRid; an.nc = nc; an.cache = { base: an.base, profiles: rivalProfiles(m) };
      S.an = an; S.anBusy = false; render();
    }, 30);
  }
  return null;
}

function stratFor(p, ownerRid) {
  const an = S.an; if (!an) return null;
  const hit = an.rows.find(st => st.p.id === p.id);
  if (hit) return hit;
  return finalize(strategy(S.model, p, S.myRid, ownerRid, an.cache), an.benchmark);
}

function survivorsCount() { return S.model.alive.filter(t => !t.clinchedChop).length; }

function simming() {
  return `<div class="empty-state"><p class="loading-tag">Running the tape</p><p>Simulating the rest of the season 3,000 times. Hang tight.</p></div>`;
}

// ---------- game plan ----------
function viewStrategy() {
  const m = S.model;
  if (!m.live) return `<p class="empty-state">Season\u2019s over. Somebody survived. Hopefully you.</p>`;
  if (!S.myRid) return `<p class="empty-state">Pick your squad up top and we\u2019ll run your season.</p>`;
  if (!m.byRid[S.myRid].alive) return `<p class="empty-state">${esc(m.byRid[S.myRid].name)} already got chopped. Pick a survivor to scout from their side.</p>`;
  const an = ensureAnalysis();
  if (!an) return simming();
  const b = an.base, w0 = b.weeks[0], k3 = Math.min(3, b.p.length - 1);
  const at = (k) => an.future[Math.min(k, an.future.length - 1)];
  const me = m.byRid[S.myRid];
  const nc = an.nc;
  const f3 = at(3);
  const expSpend = an.rows.reduce((a, st) => a + st.rec * st.recWin, 0);
  const safe = b.p[0];
  const mood = safe >= 0.9 ? 'You\u2019re not the one sweating this week.' : safe >= 0.75 ? 'You\u2019re in the mix. Don\u2019t get cute.' : 'Your neck is on the block. Spend like it.';
  const verdictTxt = an.waitWins
    ? `Patience pays. Rival money is drying up faster than the season. Prices should be about ${pct(1 - f3.priceIdx)} cheaper by week ${f3.week}, more than the ${pct(1 - f3.useLeft)} of the season you\u2019d give up. Let the rest of the league blow their bags.`
    : `Sitting on your money doesn\u2019t win by itself. Prices only drop about ${pct(1 - f3.priceIdx)} by week ${f3.week}, but anyone you buy then gives you ${pct(1 - f3.useLeft)} less season. The move is bidding under market and letting everybody else overpay.`;
  return `
  <section>
    <h2 class="stencil">Your season</h2>
    <p class="callout">${mood}</p>
    <dl class="figs">
      <div><dt>Survive wk ${w0}</dt><dd>${pct(b.p[0])}</dd></div>
      <div><dt>Alive thru wk ${b.weeks[k3]}</dt><dd>${pct(b.p[k3])}</dd></div>
      <div><dt>Last one standing</dt><dd>${pct(b.win)}</dd></div>
      <div><dt>Your bag</dt><dd class="cash">${money(me.rem)}</dd></div>
    </dl>
    <p class="note">3,000 simulated seasons from current rosters, bye weeks and projections, with scores swinging about 22% week to week. Rosters are frozen, so nobody else\u2019s future pickups count. Read these as a little optimistic.</p>
  </section>

  <section>
    <h2 class="stencil">Buy now or wait?</h2>
    <div class="slab scroll"><table class="grid"><thead><tr><th>Week</th><th>Teams left</th><th>Rival cash each</th><th>Prices vs now</th></tr></thead><tbody>
      ${[0, 3, 6, 9].map(k => at(k)).filter((f, i, arr) => arr.indexOf(f) === i).map(f => {
        const k = an.future.indexOf(f);
        return `<tr><td class="wk">Week ${f.week}</td><td class="num">${k ? Math.round(b.teamsLeft[k - 1]) : survivorsCount()}</td><td class="num cash">${money(k ? b.cashRivals[k - 1] : an.cash0)}</td><td class="num">${pct(f.priceIdx)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="note">Survivors have been spending about ${money(an.rate)} each per waiver run, and every chop takes a bankroll out of the league. Each chop should also drop about ${f1(b.upReleased.slice(0, 6).reduce((a, x) => a + x, 0) / Math.min(6, b.upReleased.length))} guys who\u2019d start for you.</p>
    <p class="callout">${verdictTxt}</p>
  </section>

  <section>
    <h2 class="stencil">Week ${w0} hit list</h2>
    ${nc ? `<p class="note">${nc.clinchedChop ? `${esc(nc.name)} is done. Their whole roster hits the wire.` : `Assumes ${esc(nc.name)} gets chopped. They\u2019re lowest right now.`} Bids balance your odds of winning against what each guy is worth to you, counting everything you can buy later.</p>` : ''}
    ${an.rows.length ? `<div class="slab scroll"><table class="grid"><thead><tr><th>Player</th><th>Bid</th><th>Odds</th><th title="Price that wins about half the time">Market</th><th title="What he\u2019s worth to you in dollars">Worth</th></tr></thead><tbody>
      ${an.rows.map(st => { const p = st.p; const fromNc = nc && nc.players.includes(p.id);
        return `<tr data-pick="${esc(p.id)}" tabindex="0">
        <td><div class="pcell">${helmetSVG(p, 34)}<div><span class="pname">${esc(p.name)}</span><span class="pmeta">${p.pos} ${esc(p.team)}${p.inj ? ` <b class="inj">${esc(p.inj)}</b>` : ''}${fromNc ? ` <span class="from">off ${esc(nc.name)}</span>` : p.chopped ? ` <span class="from">off ${esc(p.chopped.team)}</span>` : ''}</span></div></div></td>
        <td class="num cash big-n">${st.rec ? money(st.rec) : '<span class="pmeta">pass</span>'}</td>
        <td class="num">${st.rec ? pct(st.recWin) : '–'}</td>
        <td class="num">${money(st.b50)}</td>
        <td class="num">${money(st.worth)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="note">Fire all of these and expect to spend about ${money(expSpend)}. They fight for the same flex spots, so once you land one, the next is worth less. Work from the top.</p>`
    : `<p class="empty-state">Nobody out there would start for you. Your roster\u2019s too clean. Save the bag.</p>`}
  </section>`;
}

// ---------- bid lab ----------
function viewBid() {
  const m = S.model;
  if (!S.myRid) return `<p class="empty-state">Pick your squad up top so the lab knows your bag and your lineup.</p>`;
  const p = S.pick && (m.pool.find(x => x.id === S.pick) || m.players[S.pick]);
  if (!p) return `<p class="empty-state">Tap a player on the hit list or the waiver wire to cook up a bid.</p>`;
  const owner = m.alive.find(t => t.players.includes(p.id));
  if (owner && owner.rid === S.myRid) return `<p class="empty-state">${esc(p.name)} is already yours. Relax.</p>`;
  if (!m.byRid[S.myRid].alive) return `<p class="empty-state">${esc(m.byRid[S.myRid].name)} got chopped. No bag, no bids.</p>`;
  if (!ensureAnalysis()) return simming();
  const st = stratFor(p, owner && owner.rid);
  const plan = st.plan;
  if (S.bid == null || S.bid > plan.myRem) S.bid = st.rec || 0;
  const max = Math.max(plan.myRem, ...plan.rivals.map(r => r.rem), 1);
  S.plan = plan; S.max = max; S.st = st;
  const fit = plan.myUp > 0.5 ? `He starts for you: <b>+${f1(plan.myUp)}</b> points a game over your weakest guy he\u2019d replace. Title odds go ${pct(st.base.win)} to ${pct(st.withP.win)}.`
    : `He wouldn\u2019t crack your lineup. Only bid to keep him away from someone scary.`;
  const top = plan.interested[0];
  const steps = [
    ['Smart money', st.rec, st.rec ? `${pct(st.recWin)} to win. He\u2019s worth about ${money(st.worth)} to you. This is the sweet spot.` : `He\u2019s worth about ${money(st.worth)} to you, less than it takes to win. Pass, or throw a flier.`],
    ['Coin flip', st.b50, `Wins about half the time, based on what this league pays and how each rival bids.`],
    ['Statement bid', st.b80, st.b80 != null ? `Wins about 80% of the time. Everybody will see it.` : `Your bag can\u2019t get you to 80%.`],
    ['Break the bank', plan.lock, !top ? 'Nobody else wants him.' : top.rem >= plan.myRem ? `${esc(top.t.name)} is sitting on ${money(top.rem)}. Even all in isn\u2019t a lock.` : `Beats every rival\u2019s whole bankroll. Nobody touches it.`]
  ].filter(x => x[1] != null);
  return `
  <section class="player">
    <div class="card">
      <div class="card-art">${avatarSVG(p, 132)}</div>
      <div class="card-id">
        <h2 class="tag">${esc(p.name)}</h2>
        <p class="pmeta">${p.pos} ${esc(p.team)}${p.inj ? ` <b class="inj">${esc(p.inj)}</b>` : ''}${p.chopped ? ` <span class="from">off ${esc(p.chopped.team)}, chopped week ${p.chopped.week}</span>` : ''}</p>
        <p class="rating"><span>${Math.round(Math.min(99, 40 + (p.val || 0) * 3))}</span> street rating</p>
      </div>
    </div>
    <dl class="figs"><div><dt>Proj/gm</dt><dd>${f1(p.val)}</dd></div><div><dt>Worth to you</dt><dd class="cash">${money(st.worth)}</dd></div><div><dt>Market</dt><dd>${money(st.b50)}</dd></div><div><dt>Your bag</dt><dd class="cash">${money(plan.myRem)}</dd></div></dl>
    ${owner ? `<p class="note">Still on ${esc(owner.name)}. This assumes they get chopped and he hits the wire.</p>` : ''}
    <p class="callout">${fit}</p>
  </section>

  <section>
    <h2 class="stencil">Pick your bid</h2>
    <div class="steps">${steps.map(([l, v, why]) => `<button class="step" data-setbid="${v}" aria-pressed="${S.bid === v}"><span class="sl">${l}</span><span class="sv">${money(v)}</span><span class="sw">${why}</span></button>`).join('')}</div>
  </section>

  <section class="ladder-wrap">
    <h2 class="stencil">Where it lands</h2>
    <div class="ladder" aria-hidden="true">
      ${plan.rivals.map(r => `<span class="tick ${r.up > 0.5 ? 'hot' : ''}" style="left:${(r.rem / max) * 100}%" title="${esc(r.t.name)} ${money(r.rem)}"></span>`).join('')}
      <span class="blade" id="blade" style="left:${(S.bid / max) * 100}%"><em>${money(S.bid)}</em></span>
    </div>
    <div class="ladder-scale"><span>$0</span><span>${money(max)}</span></div>
    <input type="range" id="bid" min="0" max="${plan.myRem}" step="1" value="${S.bid}" aria-label="Your bid">
    <p class="verdict" id="verdict">${verdict()}</p>
    <p class="legend"><span class="tick hot"></span> bankroll of a rival who\u2019d start him <span class="tick"></span> one who wouldn\u2019t</p>
  </section>

  <section>
    <h2 class="stencil">Who\u2019s coming for him</h2>
    <div class="slab scroll"><table class="grid"><thead><tr><th>Team</th><th>Bag</th><th>Upgrade</th><th title="Chance they bid at all, from their history">Bids?</th></tr></thead><tbody>
      ${[...st.wc.rivals].sort((a, b) => b.rem - a.rem).map(r => `
        <tr><td>${esc(r.t.name)}</td><td class="num cash">${money(r.rem)}</td><td class="num">+${f1(r.up)}</td><td class="num">${pct(r.pBid)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nobody. Free money.</td></tr>'}
    </tbody></table></div>
    <p class="note">"Bids?" comes from how often each team has chased big names this season. How much they bid also reflects how reckless they\u2019ve been with their bag.</p>
  </section>`;
}

function verdict() {
  const st = S.st, plan = S.plan; if (!st) return '';
  const w = st.wc.pWin(S.bid);
  const left = plan.myRem - S.bid;
  const judge = S.bid > st.worth ? `That\u2019s ${money(S.bid - st.worth)} of overpay. Hope he\u2019s worth the flex.` : `That\u2019s ${money(st.worth - S.bid)} under what he\u2019s worth to you. Respect.`;
  return `At ${money(S.bid)} you take him about <b>${pct(w)}</b> of the time. ${judge} Win it and you\u2019ve got ${money(left)} left for the ~${f1(st.lifeWeeks)} weeks you\u2019re expected to last.`;
}

// ---------- bankrolls ----------
function viewBudgets() {
  const m = S.model;
  const total = m.alive.reduce((a, t) => a + t.rem, 0) || 1;
  const maxRem = Math.max(...m.alive.map(t => t.rem), 1);
  const rows = [...m.alive].sort((a, b) => b.rem - a.rem);
  return `
  <section>
    <h2 class="stencil">Who\u2019s got money</h2>
    <p class="note">${money(total)} still on the street. ${m.live ? (m.started ? 'Live points this week. The small number is what\u2019s still coming from guys playing.' : 'Red means your lineup\u2019s projected near the bottom.') : ''}</p>
    <div class="slab scroll"><table class="grid"><thead><tr><th>Team</th><th>Bag</th><th class="share">Share</th>${m.live ? '<th>' + (m.started ? 'Live wk ' : 'Proj wk ') + m.week + '</th>' : ''}</tr></thead><tbody>
    ${rows.map(t => `<tr class="${t.rid === S.myRid ? 'mine' : ''}">
      <td>${esc(t.name)}</td>
      <td class="num cash">${money(t.rem)}<span class="bar"><i style="width:${(t.rem / maxRem) * 100}%"></i></span></td>
      <td class="num share">${Math.round((t.rem / total) * 100)}%</td>
      ${m.live ? `<td class="num livecell ${t.projRank <= 2 ? 'danger' : ''}">${f1(m.started ? t.now : t.final)}${m.started && t.playing.length ? `<span class="pmeta">+${f1(t.left)} to come</span>` : ''}${t.clinchedChop ? ' <span class="stamp">Chopped</span>' : t.projRank === 1 ? ' <span class="stamp">On the block</span>' : ''}</td>` : ''}
    </tr>`).join('')}
    </tbody></table></div>
  </section>
  ${m.chopped.length ? `<section><h2 class="stencil">The graveyard</h2><ol class="timeline">
    ${m.chopped.map(t => `<li><span class="wk">Week ${t.chopWeek ?? '?'}</span><span class="dead">${esc(t.name)}</span>${t.weekly[t.chopWeek] != null ? ` <span class="pmeta">${f1(t.weekly[t.chopWeek])} pts. Yikes.</span>` : ''}</li>`).join('')}
  </ol></section>` : ''}`;
}

// ---------- receipts ----------
function viewMarket() {
  const m = S.model;
  if (!m.market.length) return `<p class="empty-state">No claims have cleared yet. Once they do, every winning price and every sad losing bid lands here.</p>`;
  const name = (rid) => (m.byRid[rid] || {}).name || 'Team ' + rid;
  return `<section><h2 class="stencil">Receipts</h2>
  <p class="note">"Of their bag" is the share of the winner\u2019s money when they bid. This is what sets the market prices.</p>
  <ul class="market">${m.market.map(x => { const p = m.players[x.pid] || {};
    return `<li><div class="mrow"><span><span class="pname">${esc(p.name)}</span> <span class="pmeta">${p.pos || ''} ${esc(p.team || '')}, week ${x.week}</span></span><span class="cash big-n">${money(x.bid)}</span></div>
    <div class="pmeta">${esc(name(x.rid))}, ${Math.round(x.pct * 100)}% of their bag${x.losers.length ? ` / came up short: ${x.losers.map(l => esc(name(l.rid)) + ' ' + money(l.bid)).join(', ')}` : ''}</div></li>`; }).join('')}</ul></section>`;
}

function render() {
  const m = S.model; if (!m) return;
  const views = { pool: viewPool, next: viewStrategy, bid: viewBid, budgets: viewBudgets, market: viewMarket };
  $('#app').innerHTML = header() + `<main>${views[S.tab]()}</main>`;
  paintRefresh();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-pos],[data-pick],[data-setbid],#swap,#go,#refresh');
  if (!t) return;
  if (t.id === 'go') return connect($('#lid').value);
  if (t.id === 'refresh') return connect(S.leagueId);
  if (t.id === 'swap') { $('#app').hidden = true; $('#setup').hidden = false; return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.pos) { S.pos = t.dataset.pos; render(); }
  else if (t.dataset.pick) { S.pick = t.dataset.pick; S.bid = null; S.tab = 'bid'; render(); window.scrollTo(0, 0); }
  else if (t.dataset.setbid != null) { S.bid = +t.dataset.setbid; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'lid') connect(e.target.value);
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pick) e.target.click();
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'mine') { S.myRid = +e.target.value || null; store.set('team:' + S.leagueId, S.myRid || ''); S.bid = null; S.an = null; render(); }
  if (e.target.id === 'chopOnly') { S.choppedOnly = e.target.checked; render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#poolList').innerHTML = poolList(); }
  if (e.target.id === 'bid') {
    S.bid = +e.target.value;
    const b = $('#blade'); b.style.left = (S.bid / S.max) * 100 + '%'; b.querySelector('em').textContent = money(S.bid);
    $('#verdict').innerHTML = verdict();
    document.querySelectorAll('[data-setbid]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.setbid === S.bid));
  }
});

window.addEventListener('DOMContentLoaded', () => {
  const qs = new URLSearchParams(location.search).get('league');
  const id = qs || store.get('league') || DEFAULT_LEAGUE;
  $('#lid').value = id;
  if (id) connect(id);
});

</script>
</body>
</html>
